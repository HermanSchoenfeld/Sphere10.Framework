<article class="article-summary ln-article-summary ln-article-summary-alt">
    <a href="{url}" class="ln-article-summary-link" aria-label="{title}">
        <header class="ln-article-header">
            <h2 class="ln-article-title">{title}</h2>
            <div class="ln-article-created"><time datetime="{created_on}">{created_on_formatted}</time></div>
        </header>
        <div class="ln-article-content-row">
            <div class="ln-article-body">
                <p class="ln-article-description">{summary}</p>
                <span class="ln-article-read-link">Read article <span aria-hidden="true">&#8594;</span></span>
            </div>
            {feature}
        </div>
    </a>
</article>
