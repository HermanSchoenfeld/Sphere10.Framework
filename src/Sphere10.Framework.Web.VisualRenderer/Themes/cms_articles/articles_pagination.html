<div class="ln-articles-pagination d-flex flex-column flex-sm-row align-items-center justify-content-between gap-3 mt-4 pb-5"
     data-total-count="{total_count}" data-page-count="{page_count}">
    <p class="small text-muted mb-0">Showing {range_start}&ndash;{range_end} of {total_count} articles</p>
    <nav class="ln-articles-page-links" aria-label="Article pages">
        <ul class="pagination pagination-sm flex-wrap justify-content-center gap-1 mb-0">
            {links}
        </ul>
    </nav>
</div>
