<figure id="{object_id}" class="ln-bookmark-block">
    <a class="ln-bookmark" href="{url}">
        {image}
        <div class="ln-bookmark-content">
            {icon}
            <div class="ln-bookmark-title">{title}</div>
            <div class="ln-bookmark-description">{description}</div>
            <div class="ln-bookmark-url">{display_url}</div>
        </div>
    </a>
    <figcaption>{caption}</figcaption>
</figure>
